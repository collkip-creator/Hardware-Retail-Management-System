name: Build Hardware Retail Windows Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - desktop/local-first-migration
      - feature/offline-pos-foundation
      - feature/advanced-inventory-phase7
      - feature/catalogue-stock-ui-parity
      - feature/suppliers-purchasing-ui-parity
      - feature/customers-desktop-phase
      - feature/pos-desktop-phase
    paths:
      - "src/desktop/**"
      - "src-tauri/**"
      - "desktop.html"
      - "desktop/**"
      - "package.json"
      - "package-lock.json"
      - "vite.desktop.config.ts"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JavaScript dependencies
        run: npm install

      - name: Build Tauri Windows installer (retry transient NSIS download failures)
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Tauri NSIS build attempt $attempt of $maxAttempts"
            npm run tauri -- build --bundles nsis
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -lt $maxAttempts) {
              Write-Host "Build failed (exit $LASTEXITCODE). Waiting 30 seconds before retry..."
              Start-Sleep -Seconds 30
            }
          }
          exit 1

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: hardware-retail-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
